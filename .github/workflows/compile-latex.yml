name: Compile LaTeX CV

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.sty'
      - '**/*.cls'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (comprehensive)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-full \
            latexmk \
            imagemagick \
            ghostscript \
            poppler-utils

      - name: Compile CV to PDF
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error cv.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv.pdf
          retention-days: 90

